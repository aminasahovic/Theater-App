<div class="login-container">
  <div class="background"></div>

  <div class="overlay"></div>

  <div class="card">
    <img src="/images/logo.png" class="logo" />
    <h2>Prijava</h2>

    <form (ngSubmit)="login()">
      <input type="text" placeholder="Korisničko ime" [(ngModel)]="username" name="username" required />

      <input type="password" placeholder="Lozinka" [(ngModel)]="password" name="password" required />

      <button type="submit" class="login-btn">Prijavi se</button>
    </form>
  </div>

  <div class="error-popup" *ngIf="showError">
    <div class="popup-content">
      <p>{{ errorMessage }}</p>
      <button (click)="showError = false">Zatvori</button>
    </div>
  </div>
</div>
