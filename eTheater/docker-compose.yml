version: '3'
services:
  etheater-sql:
    image: mcr.microsoft.com/mssql/server:2017-latest-ubuntu
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=QWElkj132!
      - MSSQL_PID=Developer
    ports:
      - "1401:1433"
    expose:
      - 1433
    networks:
      - etheater
      
  etheater-api:
    restart: unless-stopped
    build:
      context: .
    environment:
      - ConnectionStrings:eTheaterConnection=Server=etheater-sql,1433;Database=eTheater;User=sa;Password=QWElkj132!;ConnectRetryCount=0;TrustServerCertificate=True;MultipleActiveResultSets=true
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "7125:7125" 
    networks:
      - etheater
    depends_on:
      - etheater-sql 
      
networks:
  etheater:
    driver: bridge
